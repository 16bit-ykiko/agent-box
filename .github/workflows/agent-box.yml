# Installed by `box install`; `box up` refuses to use this branch if the file differs.
name: agent-box
run-name: agent-box ${{ inputs.lease }}
on:
  push:
    branches: [agent-box]
  workflow_dispatch:
    inputs:
      lease:
        required: true
      pubkey:
        required: true
      minutes:
        default: "340"
permissions: {}
jobs:
  box:
    if: github.event_name == 'workflow_dispatch' && github.actor == '16bit-ykiko' && github.triggering_actor == '16bit-ykiko'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: 16bit-ykiko/agent-box@47ee17ab9627dd60d54a9356c5e3181c7293bcf5
        with:
          pubkey: ${{ inputs.pubkey }}
          minutes: ${{ inputs.minutes }}
