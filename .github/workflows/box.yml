name: box
on:
  workflow_dispatch:
    inputs:
      payload:
        description: Tunnel token and ssh keys, encrypted with BOX_KEY
        required: true
      os:
        default: ubuntu-24.04
      minutes:
        default: "340"
permissions: {}
jobs:
  box:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 355
    steps:
      - name: start sshd and tunnel
        env:
          BOX_KEY: ${{ secrets.BOX_KEY }}
          PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          plain=$(printf '%s' "$PAYLOAD" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -a -A -pass env:BOX_KEY)
          get() { printf '%s\n' "$plain" | sed -n "s/^$1=//p"; }
          token=$(get TUNNEL_TOKEN)
          echo "::add-mask::$token"
          mkdir -p ~/.ssh && get PUBKEY > ~/.ssh/authorized_keys
          chmod go-w ~ && chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          get HOSTKEY | base64 -d | sudo install -m 600 -o root /dev/stdin /etc/ssh/box_host_key
          command -v sshd >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server; }
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -p 2222 -o ListenAddress=127.0.0.1 -h /etc/ssh/box_host_key \
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o AllowUsers="$USER"
          curl -fsSL -o ~/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x ~/cloudflared
          TUNNEL_TOKEN="$token" nohup ~/cloudflared tunnel --no-autoupdate run > ~/cf.log 2>&1 &
          for i in $(seq 60); do grep -q 'Registered tunnel connection' ~/cf.log && exit 0; sleep 1; done
          echo "tunnel did not come up"; exit 1
      - name: hold
        run: |
          end=$((SECONDS + ${{ inputs.minutes }} * 60))
          while [ $SECONDS -lt $end ] && [ ! -f ~/stop ]; do sleep 10; done
