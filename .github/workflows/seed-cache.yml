name: seed-cache
on:
  push:
    branches: [main]
    paths: [.github/workflows/seed-cache.yml]
permissions: {}
jobs:
  seed:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - shell: bash
        run: mkdir -p .cache/ccache .cache/sccache && echo "relative $RUNNER_OS" > .cache/ccache/marker && echo "absolute $RUNNER_OS" > .cache/sccache/marker
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .cache/ccache
          key: ${{ runner.os }}-seed-ccache-${{ github.sha }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/.cache/sccache
          key: sccache-${{ runner.os }}-seed-${{ github.sha }}
