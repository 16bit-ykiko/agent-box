name: agent-box
description: Keep this runner open for ssh over a Cloudflare tunnel until stopped, idle or timed out.
inputs:
  pubkey:
    description: The only ssh key allowed to log in (one ssh-ed25519 public key)
    required: true
  minutes:
    description: Maximum lifetime in minutes
    default: "340"
  idle-minutes:
    description: Stop after this many minutes without an ssh connection or a running job
    default: "60"
  cache-path:
    description: >-
      Restore this actions/cache path before the box comes up, written exactly as the repo's CI
      writes it ({0} stands for the workspace); empty for none
    default: ""
  cache-key:
    description: Primary key for the restore
    default: ""
  cache-restore-keys:
    description: Key prefixes to fall back to, one per line
    default: ""
runs:
  using: composite
  steps:
    - name: start sshd and tunnel
      if: runner.os != 'Windows'
      shell: bash
      env:
        PUBKEY: ${{ inputs.pubkey }}
      run: bash "$GITHUB_ACTION_PATH/runner/start.sh"
    - name: start sshd and tunnel
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        PUBKEY: ${{ inputs.pubkey }}
      run: '& "$env:GITHUB_ACTION_PATH/runner/start.ps1"'
    # Read-only: a box never saves, the repo's cache quota belongs to its CI.
    - id: cache
      if: inputs.cache-path != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ format(inputs.cache-path, github.workspace) }}
        key: ${{ inputs.cache-key }}
        restore-keys: ${{ inputs.cache-restore-keys }}
    - if: inputs.cache-path != ''
      shell: bash
      env:
        MATCHED: ${{ steps.cache.outputs.cache-matched-key }}
        CACHE_PATH: ${{ format(inputs.cache-path, github.workspace) }}
      run: printf '%s\n%s\n' "${MATCHED:-none}" "$CACHE_PATH" > ~/.box/cache
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: box
        path: ~/.box/box.json
        retention-days: 1
    - name: hold
      shell: bash
      env:
        MINUTES: ${{ inputs.minutes }}
        IDLE_MINUTES: ${{ inputs.idle-minutes }}
      run: bash "$GITHUB_ACTION_PATH/runner/hold.sh"
