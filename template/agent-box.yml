# Installed by `box install`; `box up` refuses to use this branch if the file differs.
name: agent-box
run-name: agent-box ${{ inputs.lease }}
on:
  push:
    branches: [agent-box]
  workflow_dispatch:
    inputs:
      lease:
        required: true
      pubkey:
        required: true
      minutes:
        default: "340"
      os:
        type: choice
        default: linux
        options: [linux, linux-arm, macos, macos-intel, windows, windows-arm]
      cache-path:
        default: ""
      cache-key:
        default: ""
      cache-restore-keys:
        default: ""
permissions: {}
jobs:
  box:
    if: github.event_name == 'workflow_dispatch' && github.actor == '@OWNER@' && github.triggering_actor == '@OWNER@'
    runs-on: ${{ fromJSON('{"linux":"ubuntu-24.04","linux-arm":"ubuntu-24.04-arm","macos":"macos-15","macos-intel":"macos-15-intel","windows":"windows-2025","windows-arm":"windows-11-arm"}')[inputs.os] || 'ubuntu-24.04' }}
    timeout-minutes: 350
    steps:
      - uses: @ACTION@@@SHA@
        with:
          pubkey: ${{ inputs.pubkey }}
          minutes: ${{ inputs.minutes }}
          cache-path: ${{ inputs.cache-path }}
          cache-key: ${{ inputs.cache-key }}
          cache-restore-keys: ${{ inputs.cache-restore-keys }}
